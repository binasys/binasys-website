---
title: "How We Help"
description: "Find where AI can help, reduce repetitive work and make sense of your business data. Strategy, analysis and tools built around your needs."
pageId: "services"
serviceDialog: true # adds the service detail dialog and its <noscript> style
---

<section class="page-intro wrap" aria-labelledby="services-title">
  <a class="back-home" href="/"><span aria-hidden="true">←</span> Home</a>
  <p class="eyebrow">HOW WE HELP</p>
  <h1 id="services-title">
    A plan.<br />
    And help to make it happen.
  </h1>
  <p>Strategy, analysis and tools built around what you need.</p>
</section>
<section class="help-section wrap" id="help" aria-label="Our services">
  {% from "macros.njk" import lines %}
  <div class="help-grid">
    {% for service in services %}
    <article class="help-card" data-kind="{{ service.id }}" id="{{ service.id }}">
      <span class="number">{{ loop.index | pad2 }} / {{ service.name | upper | e }}</span>
      <h3>{{ lines(service.headline) }}</h3>
      <p>{{ lines(service.text) }}</p>
      {% include "service-art/" + service.id + ".njk" ignore missing %}
      <a
        class="service-trigger"
        data-service="{{ service.id }}"
        href="/services#service-{{ service.id }}"
        aria-label="Explore {{ service.name | lower | e }}"
        >Explore
        <span aria-hidden="true"
          ><svg width="16" height="16" viewBox="0 0 20 20" fill="none" focusable="false">
            <path
              d="M10 3v14M3 10h14"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            /></svg></span></a
      ><noscript
        ><ul class="service-nojs">
          {% for offer in service.offers %}
          <li>{{ offer | e }}</li>
          {% endfor %}
        </ul></noscript
      >
    </article>
    {% endfor %}
  </div>
</section>
<div class="page-next wrap">
  <a class="text-link" href="/industries"
    >What this could look like for your business <span aria-hidden="true">↗</span></a
  >
</div>
<section class="contact-section contact-compact wrap">
  <p class="eyebrow">LET’S TALK</p>
  <h2>
    Where is your<br />
    time going?
  </h2>
  <a class="primary" href="/contact">Let’s talk <span aria-hidden="true">↗</span></a>
</section>

---
title: "Services | Binasys"
description: "AI and automation, strategy and business consulting, and marketing strategy and execution for Malaysian SMEs."
pageId: "services"
serviceDialog: true # adds the service detail dialog and its <noscript> style
---

<section class="page-intro wrap" aria-labelledby="services-title">
  <a class="back-home" href="/"><span aria-hidden="true">←</span> Home</a>
  <p class="eyebrow">SERVICES</p>
  <h1 id="services-title">Our services</h1>
  <p>
    Our services cover advice and implementation across technology, business operations and
    marketing.
  </p>
</section>
<section class="help-section wrap" id="help" aria-label="Our services">
  {% from "macros.njk" import lines %}
  <div class="help-grid">
    {% for service in services %}
    <article class="help-card" data-kind="{{ service.id }}" id="{{ service.id }}">
      <span class="number">{{ loop.index | pad2 }}</span>{% if service.id == "work" %}<span
        id="clarity"
        class="anchor-alias"
        aria-hidden="true"
      ></span
      ><span id="service-clarity" class="anchor-alias" aria-hidden="true"></span>{% endif %}<span
        id="service-{{ service.id }}"
        class="anchor-alias"
        aria-hidden="true"
      ></span>
      <h3>{{ lines(service.headline) }}</h3>
      <p>{{ lines(service.text) }}</p>
      {% include "service-art/" + service.id + ".njk" ignore missing %}
      <a
        class="service-trigger"
        data-service="{{ service.id }}"
        href="/services#{{ service.id }}"
        aria-label="See what’s included in {{ service.name | e }}"
        >See what’s included
        <span aria-hidden="true"
          ><svg width="16" height="16" viewBox="0 0 20 20" fill="none" focusable="false">
            <path
              d="M10 3v14M3 10h14"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            /></svg></span></a
      ><noscript
        ><ul class="service-nojs">
          {% for offer in service.offers %}
          <li>{{ offer | e }}</li>
          {% endfor %}
        </ul></noscript
      >
    </article>
    {% endfor %}
  </div>
</section>
<div class="page-next wrap">
  <a class="text-link" href="/industries"
    >See examples by industry <span aria-hidden="true">↗</span></a
  >
</div>
<section class="contact-section contact-compact wrap">
  <h2>Discuss your business needs.</h2>
  <a class="primary" href="/contact">Contact us <span aria-hidden="true">↗</span></a>
</section>

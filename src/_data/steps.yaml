# Engagement stages, shown in full on Our approach.
- title: Business review
  text: We discuss your objectives and review the relevant operations, information and existing systems. This establishes what the project needs to address.
- title: Scope and proposal
  text: We set out the recommended work, deliverables, responsibilities, timing and cost in a written proposal. Work begins once the scope is agreed.
- title: Implementation
  text: We develop and test the agreed work with your team, then support its introduction into day-to-day operations.
- title: Review and follow-up
  text: We review the work against the agreed objectives and confirm any handover, support or further work required.

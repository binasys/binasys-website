# "How it works" steps, shown on the home page. Numbers (01, 02, 03) are added automatically.
#
# How to edit: change the text after "title:" or "text:". To add a step, copy a whole block
# (from "- title:" to the end of "text:"). The order here is the order on the page.
# House style: British English, short sentences, headings in sentence case.

- title: We get to know your business.
  text: We hear what’s not working and see how your team does things today.

- title: We agree on the work.
  text: We send a written proposal. It says what we’d do and what it costs.

- title: We get to work.
  text: Once you say yes, we get started and keep you updated as we go.

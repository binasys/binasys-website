about:
  - Binasys is a business consulting firm based in Kuala Lumpur. We work with Malaysian SMEs on business strategy, technology and marketing.
  - We support clients from the initial business review through to implementation. The scope, responsibilities and cost are agreed before work begins, with progress reviewed throughout the engagement.
values:
  - title: Commercial focus
    text: We assess recommendations against their value to the business and the investment required.
  - title: Accountability
    text: We agree responsibilities and deliverables, and keep clients informed as the work progresses.
  - title: Collaboration
    text: We involve the people who will use and manage the changes.

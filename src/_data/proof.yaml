cases:
  - industry: Distribution, Selangor
    problem: Orders arrived by email and WhatsApp, and staff retyped them into spreadsheets.
    work: We set up a simple tool that reads each order and adds it to one shared order list.
    result: Fewer typing errors and orders processed on the same day.
    placeholder: true
  - industry: Manufacturing, Penang
    problem: Management could not see which products were making money.
    work: We brought sales and cost records together and built a monthly report.
    result: Two loss-making product lines identified and repriced.
    placeholder: true
  - industry: Retail, Kuala Lumpur
    problem: The owner was unsure where to start with AI.
    work: We reviewed how the team spent its time and agreed three priorities.
    result: A clear six-month plan, with the first change in place within a month.
    placeholder: true

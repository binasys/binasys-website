# Industries, shown as tabs on the "Your business" page (industries.html).
#
# How to edit:
# - Change the text after the colon. Keep quotes around text that contains a colon.
# - Lines under "headline:" and "intro:" are shown on separate lines on the page. Use one line
#   or several; each starts with "- ".
# - To add an industry, copy a whole block (from "- id:" to the last "helps" line) and paste it
#   below. Give it a new, unique id in lower case with no spaces (e.g. "clinics").
# - "icon" must be one of: factory, boxes, shop, document. Ask the website team for a new icon.
# - The order here is the order of the tabs. The first one is open when the page loads.
#
# House style: British English, short sentences, plain words. Say what we do for the business.
# Never name clients.
#
# Fields:
#   id:        Short unique name used in the page address. Don't change it once published.
#   tab:       Label on the tab button.
#   eyebrow:   Small capital-letter label above the headline.
#   headline:  Large heading (one item per line).
#   intro:     Short text under the heading (one item per line).
#   helps:     The "We can help you:" list.

- id: manufacturing
  tab: Factories
  icon: factory
  headline:
    - Keep production
    - moving.
  intro:
    - Less time hunting for the right order sheet or stock count.
  helps:
    - Turn customer orders into job sheets your floor team can follow.
    - Organise inspection records so quality issues are easier to trace.
    - Plan when to buy materials and when machines are due for servicing.

- id: distribution
  tab: Distributors & wholesalers
  icon: boxes
  headline:
    - Stay on top of
    - orders and stock.
  intro:
    - Less retyping.
    - Less chasing payments.
  helps:
    - Prepare quotes and orders faster, and get a reminder when a customer is due to reorder.
    - See what needs restocking and what isn’t selling.
    - Match payments to invoices and follow up on overdue bills.

- id: retail
  tab: Shops & online stores
  icon: shop
  headline:
    - Know what’s selling.
    - Know what’s in stock.
  intro: []
  helps:
    - Keep shop and online orders in one place.
    - Update product details and plan when to restock.
    - Check payouts from marketplaces like Shopee and Lazada, and flag anything missing.

- id: legal
  tab: Law firms
  icon: document
  headline:
    - More time
    - for your clients.
  intro:
    - Less time gathering details
    - and searching documents.
  helps:
    - Collect new client details and book appointments without the back-and-forth.
    - Find key terms and dates in documents for your team to review.
    - Prepare bills and send clients regular updates on their matters.

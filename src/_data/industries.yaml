# Example project scopes, not claims of completed client work. Preserve published IDs.
- id: manufacturing
  tab: Manufacturing
  icon: factory
  headline: Production and operations
  intro: Business planning and technology for the work from order to delivery.
  helps:
    - Review production planning and management reporting.
    - Turn customer orders into job sheets and organise quality records.
    - Plan material purchases and maintenance schedules.
- id: distribution
  tab: Distribution & wholesale
  icon: boxes
  headline: Sales, stock and fulfilment
  intro: Improve the flow between customer demand, purchasing and delivery.
  helps:
    - Review sales performance, stock availability and purchasing.
    - Prepare quotations and orders with fewer repeated entries.
    - Match payments to invoices and support follow-up on overdue accounts.
- id: retail
  tab: Retail & e-commerce
  icon: shop
  headline: Retail and online growth
  intro: Bring marketing and store operations into the same business plan.
  helps:
    - Develop store websites and marketing campaigns.
    - Review product performance and plan stock replenishment.
    - Connect order, stock and payment records.
- id: legal
  tab: Professional services
  icon: document
  headline: Client service and administration
  intro: Support client-facing teams with more consistent information and workflows.
  helps:
    - Organise client onboarding and appointment workflows.
    - Find key terms and dates in documents for your team to review.
    - Develop service websites and review enquiry performance.
